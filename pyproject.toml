[project]
name = "fraudwatch"
version = "0.1.0"
description = "Transaction fraud detection with drift monitoring: training pipeline, real-time scoring, and monitoring."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
fraudwatch = "fraudwatch.cli:app"

[project.optional-dependencies]
data = [
    "kaggle>=2.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudwatch"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PD", "NPY"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["fraudwatch"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandera.*", "kaggle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (excluded from default CI run)",
    "realdata: requires the real IEEE-CIS data in data/raw (never runs in CI)",
    "locked: phase acceptance test; must not be weakened without an explicitly reviewed commit",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
eda = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
